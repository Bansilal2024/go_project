name: Go Microservices CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SECRET SCANNING
  # ============================================================

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gacts/gitleaks@bb7dca3450856d36327e2e807e4961e7f2a7b811
        with:
          fail-on-error: true


  # ============================================================
  # 2. UNIT TESTS
  # ============================================================

  unit-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - order-service

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Download Go dependencies
        working-directory: services/${{ matrix.service }}
        run: go mod download

      - name: Run unit tests
        working-directory: services/${{ matrix.service }}
        run: go test -v ./...


  # ============================================================
  # 3. BUILD + TRIVY + DOCKER HUB
  # ============================================================

  docker:
    name: Build Scan Push
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - unit-tests

    strategy:
      matrix:
        service:
          - user-service
          - order-service

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # Docker Build
      # --------------------------------------------------------

      - name: Build Docker image
        working-directory: services/${{ matrix.service }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          docker build \
            -t "$DOCKERHUB_USERNAME/$SERVICE_NAME:$IMAGE_TAG" \
            -t "$DOCKERHUB_USERNAME/$SERVICE_NAME:latest" \
            .


      # --------------------------------------------------------
      # Show Docker Images
      # --------------------------------------------------------

      - name: Show Docker images
        run: docker images


      # --------------------------------------------------------
      # Trivy Scan
      # --------------------------------------------------------

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


      # --------------------------------------------------------
      # Push SHA Tagged Image
      # --------------------------------------------------------

      - name: Push SHA tagged image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          docker push \
            "$DOCKERHUB_USERNAME/$SERVICE_NAME:$IMAGE_TAG"


      # --------------------------------------------------------
      # Push Latest Image
      # --------------------------------------------------------

      - name: Push latest image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          docker push \
            "$DOCKERHUB_USERNAME/$SERVICE_NAME:latest"